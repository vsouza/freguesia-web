# Freguesia staging on Fly.io (São Paulo region, PRD §15).
# This file only describes the configuration. The app does not exist on Fly yet:
# creating the app and Postgres costs money, so it is a manual, confirmed step.
#
# Secrets to set before the first deploy:
#   fly secrets set DATABASE_URL=... SECRET_KEY_BASE=...

app = "freguesia-staging"
primary_region = "gru"

[env]
  PHX_HOST = "freguesia-staging.fly.dev"
  PORT = "8080"
  PHX_SERVER = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
