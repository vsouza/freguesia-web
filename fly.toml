# Staging da Freguesia no Fly.io (região São Paulo, PRD §15).
# Este arquivo só descreve a configuração. O app ainda não existe na Fly:
# criar o app e o Postgres custa dinheiro, então é um passo manual e confirmado.
#
# Segredos a definir antes do primeiro deploy:
#   fly secrets set DATABASE_URL=... SECRET_KEY_BASE=...

app = "freguesia-staging"
primary_region = "gru"

[env]
  PHX_HOST = "freguesia-staging.fly.dev"
  PORT = "8080"
  PHX_SERVER = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
