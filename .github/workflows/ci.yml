name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Format, lint, security, types, tests
    runs-on: ubuntu-latest

    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      MIX_ENV: test
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - name: Cache deps, build and dialyzer PLT
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-beam-${{ hashFiles('mix.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-beam-${{ hashFiles('mix.lock') }}-

      - run: mix deps.get

      - name: Format
        run: mix format --check-formatted

      - name: Compile (warnings are errors)
        run: mix compile --warnings-as-errors

      - name: Credo
        run: mix credo --strict

      - name: Sobelow
        run: mix sobelow --exit medium

      - name: Dialyzer
        run: mix dialyzer

      - name: Tests with coverage
        run: mix test --cover
